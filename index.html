<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumire Portal TEST | すみれクラブ予約ポータル</title>
  <style>
    :root{
      --bg:#f8f5fc;
      --card:#ffffff;
      --line:#e4dbea;
      --text:#2f2b36;
      --sub:#655e6e;
      --accent:#7655a8;
      --accent-dark:#4f3a78;
      --accent-bg:#efe8f8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
      background:linear-gradient(180deg,#fbf9fd 0%,var(--bg) 100%);
      color:var(--text);
      line-height:1.7;
    }
    .wrap{
      width:min(860px,calc(100% - 32px));
      margin:0 auto;
      padding:40px 0 56px;
    }
    header{
      text-align:center;
      margin-bottom:28px;
      padding:34px 22px 30px;
      border-radius:24px;
      color:#fff;
      background:linear-gradient(120deg,var(--accent-dark),var(--accent));
      box-shadow:0 12px 30px rgba(79,58,120,.15);
    }
    h1{font-size:clamp(26px,5vw,40px);margin:9px 0 8px;letter-spacing:.015em}
    .badge{
      display:inline-block;
      padding:4px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      color:#fff;
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
      border:1px solid rgba(255,255,255,.32);
    }
    .lead{margin:18px auto 0;max-width:660px;color:#f5effd}
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
      margin-top:28px;
    }
    .card{
      display:flex;
      flex-direction:column;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:24px;
      box-shadow:0 4px 18px rgba(79,58,120,.07);
    }
    .card h2{margin:0 0 8px;font-size:21px;color:var(--accent-dark)}
    .card p{margin:0 0 18px;color:var(--sub);flex:1}
    .btn{
      display:block;
      text-align:center;
      text-decoration:none;
      background:var(--accent);
      color:#fff;
      font-weight:800;
      padding:13px 16px;
      border-radius:10px;
      transition:background-color .2s ease,transform .2s ease;
    }
    .card:nth-child(2) .btn{background:var(--accent-dark)}
    .btn:hover{background:#60438f;transform:translateY(-1px)}
    .card:nth-child(2) .btn:hover{background:#3d2c61}
    .btn:focus-visible{outline:3px solid #a58ac9;outline-offset:3px}
    .note{
      margin-top:24px;
      background:var(--accent-bg);
      border:1px solid #d6c8e6;
      border-radius:12px;
      padding:14px 16px;
      color:var(--accent-dark);
      font-size:14px;
    }
    footer{margin-top:28px;text-align:center;color:#77717d;font-size:12px}
    @media(max-width:680px){
      .grid{grid-template-columns:1fr}
      .wrap{padding-top:16px}
      header{padding:26px 14px;border-radius:18px}
    }
    @media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="badge">Sumire Portal TEST</div>
      <h1>すみれクラブ予約ポータル</h1>
      <p class="lead">TEST環境です。利用する予約画面を選択してください。</p>
    </header>

    <section class="grid" aria-label="予約画面">
      <article class="card">
        <h2>平日の予約</h2>
        <p>通常保育日・午前保育日の予約確認に使用します。</p>
        <a class="btn" href="./weekday_TEST.html">平日版TESTを開く</a>
      </article>

      <article class="card">
        <h2>長期休暇の予約</h2>
        <p>夏休み・冬休み・春休みの予約確認に使用します。</p>
        <a class="btn" href="./holiday_TEST.html">長期休暇版TESTを開く</a>
      </article>
    </section>

    <div class="note">このページは開発・動作確認用のTESTポータルです。</div>

    <footer>Sumire Portal TEST / すみれクラブ予約システム Ver.2.0</footer>
  </main>
</body>
</html>
